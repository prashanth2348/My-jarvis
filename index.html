<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My JARVIS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #101820;
      color: white;
    }

    h1 {
      font-size: 40px;
    }

    #reply {
      font-size: 22px;
      margin: 30px 10px;
      min-height: 60px;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border-radius: 12px;
      margin: 8px;
      cursor: pointer;
    }

    #searchBox {
      display: none;
      margin-top: 20px;
    }

    #searchBox input {
      font-size: 18px;
      padding: 12px;
      width: 80%;
      max-width: 400px;
      border-radius: 10px;
      border: none;
    }

    #searchBox button {
      font-size: 18px;
      padding: 12px 20px;
    }
  </style>
</head>

<body>

  <h1>🤖 MY JARVIS</h1>

  <p id="reply">Hello Prashanth. I am JARVIS.</p>

  <button onclick="listen()">🎙️ Talk to JARVIS</button>

  <div id="searchBox">
    <input id="searchInput" type="text" placeholder="Search Google...">
    <br>
    <button onclick="searchGoogle()">🔎 Search</button>
    <button onclick="goBack()">⬅️ Back</button>
  </div>

  <script>

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition;

    // 🎙️ VOICE LISTEN
    function listen() {

      if (!SpeechRecognition) {
        speak("Sorry Prashanth, voice recognition is not supported.");
        return;
      }

      recognition = new SpeechRecognition();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      document.getElementById("reply").innerText =
        "🎙️ Listening...";

      recognition.start();

      recognition.onresult = function(event) {

        const command =
          event.results[0][0].transcript.trim();

        handleCommand(command);
      };

      recognition.onerror = function() {
        document.getElementById("reply").innerText =
          "❌ I couldn't hear you. Try again.";
      };
    }


    // 🧠 COMMAND HANDLER
    function handleCommand(command) {

      const lowerCommand = command.toLowerCase();

      document.getElementById("reply").innerText =
        "You said: " + command;


      // 🔎 SEARCH
      if (lowerCommand.startsWith("search")) {

        const query = command.substring(6).trim();

        if (query) {
          searchGoogleWithQuery(query);
          return;
        }

        speak("What should I search?");
        showSearchBox();
        return;
      }


      // ⬅️ BACK
      if (
        lowerCommand === "back" ||
        lowerCommand === "go back" ||
        lowerCommand === "venakki" ||
        lowerCommand === "venaka" ||
        lowerCommand.includes("go back")
      ) {

        goBack();
        return;
      }


      // 🔎 ANOTHER SEARCH
      if (
        lowerCommand.includes("another search") ||
        lowerCommand.includes("another") ||
        lowerCommand.includes("inko search") ||
        lowerCommand.includes("next search")
      ) {

        showSearchBox();

        speak("Okay Prashanth. What should I search?");
        return;
      }


      // 👋 HELLO
      if (
        lowerCommand.includes("hello") ||
        lowerCommand.includes("hi")
      ) {

        speak("Hello Prashanth. How can I help you?");
        return;
      }


      // 🕐 TIME
      if (lowerCommand.includes("time")) {

        const now = new Date();

        const time = now.toLocaleTimeString(
          "en-IN",
          {
            hour: "numeric",
            minute: "2-digit"
          }
        );

        speak("The time is " + time);
        return;
      }


      // 🤖 NORMAL COMMAND
      speak("You said " + command);
    }


    // 🔎 SEARCH WITH VOICE
    function searchGoogleWithQuery(query) {

      document.getElementById("searchInput").value = query;

      document.getElementById("reply").innerText =
        "🔎 Searching Google for: " + query;

      speak("Searching Google for " + query);

      setTimeout(function() {

        window.location.href =
          "https://www.google.com/search?q=" +
          encodeURIComponent(query);

      }, 700);
    }


    // 🔎 SEARCH BUTTON
    function searchGoogle() {

      const query =
        document.getElementById("searchInput").value.trim();

      if (!query) {
        speak("Please enter something to search.");
        return;
      }

      searchGoogleWithQuery(query);
    }


    // 📦 SHOW SEARCH BOX
    function showSearchBox() {

      document.getElementById("searchBox").style.display =
        "block";

      document.getElementById("searchInput").focus();
    }


    // ⬅️ BACK FUNCTION
    function goBack() {

      document.getElementById("reply").innerText =
        "⬅️ Going back...";

      speak("Going back to JARVIS.");

      setTimeout(function() {

        window.history.back();

      }, 500);
    }


    // 🔊 TEXT TO SPEECH
    function speak(text) {

      if ("speechSynthesis" in window) {

        window.speechSynthesis.cancel();

        const message =
          new SpeechSynthesisUtterance(text);

        message.lang = "en-IN";
        message.rate = 1;
        message.pitch = 1;

        window.speechSynthesis.speak(message);
      }
    }

  </script>

</body>
</html>
